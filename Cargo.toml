[package]
name = "kyu"
version = "1.1.0"
description = "osu! score and profile queue for Twitch streams"
license = "MIT"
repository = "https://github.com/sheynor43/kyu"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37.0"
open = "5.4.5"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
ureq = "3.5.1"

[build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
